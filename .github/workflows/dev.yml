name: Deploy to EC2 instance.

on:
  pull_request:
    types:
      - closed
    branches:
      - 'develop'

env:
  IMAGE_NAME: bitbytecyber/helpdesk
  TAG: dev

jobs:
  build_and_push:
    name: Push Docker image to Docker Hub
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@ad44023a93711e3deb337508980b4b5e9bcdc5dc
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.TAG }}

  deploy:
    name: Deploy Docker Container on EC2
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: Deploy to EC2 instance
        uses: appleboy/ssh-action@v1.0.0
        with:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.HOST_USERNAME }}
          PASSWORD: ${{ secrets.HOST_PASSWORD }}
          envs: IMAGE_NAME,GITHUB_SHA,COMMAND
          script: |
            # The following command does three things
            #   1. Stop and remove relevant running containers
            #   2. Pull the latest images for the containers from Docker Hub
            #   3. Run new containers using recently pulled images

            docker compose -f /root/helpdesk/docker/docker-compose.helpdesk.yml --env-file /root/helpdesk/config/.env.dev pull && \
            docker compose -f /root/helpdesk/docker/docker-compose.helpdesk.yml --env-file /root/helpdesk/config/.env.dev down && \
            docker compose -f /root/helpdesk/docker/docker-compose.helpdesk.yml --env-file /root/helpdesk/config/.env.dev up -d

      - name: Send email
        if: always()
        uses: dawidd6/action-send-mail@v2
        with:
          # mail server settings
          server_address: smtp.gmail.com
          server_port: 465
          # user credentials
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          # email subject
          subject: Helpdesk Backend - Dev
          # email body as text
          body: ${{ github.job }} job in worflow ${{ github.workflow }} of ${{ github.repository }} has ${{ job.status }}
          # comma-separated string, send email to
          to: enganaskhalid@gmail.com
          # from email name
          from: Helpdesk Backend - Dev