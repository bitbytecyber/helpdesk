name: Deploy to EC2 instance.

on:
  pull_request:
    types:
      - closed
    branches:
      - 'develop'

env:
  IMAGE_NAME: bitbytecyber/helpdesk
  TAG: dev

jobs:
  build_and_push:
    name: Push Docker image to Docker Hub
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # There is no Dockerfile in this repo, and that is deliberate: Helpdesk
      # ships in no official image, so the image is built from frappe_docker's
      # upstream layered Containerfile with apps.json passed in as a BuildKit
      # secret. build-image.sh owns the pinned frappe_docker ref, the Frappe
      # branch and the cache-bust hash -- CI calls it rather than duplicating
      # any of that in a build-push-action step.
      - name: Build Docker image
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
          TAG: ${{ env.TAG }}
        run: bash ./build-image.sh

      - name: Push Docker image
        run: |
          set -euo pipefail
          # Also tag the commit, so a bad dev build can be rolled back by
          # redeploying a sha rather than rebuilding.
          docker tag "$IMAGE_NAME:$TAG" "$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE_NAME:$TAG"
          docker push "$IMAGE_NAME:$GITHUB_SHA"

  deploy:
    name: Deploy Docker Container on EC2
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: Deploy to EC2 instance
        uses: appleboy/ssh-action@v1.0.0
        with:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.HOST_USERNAME }}
          PASSWORD: ${{ secrets.HOST_PASSWORD }}
          envs: IMAGE_NAME,TAG,GITHUB_SHA
          script_stop: true
          script: |
            set -euo pipefail

            # Server layout, which differs from this repo's root: the compose
            # file lives under docker/ and the environment under config/.
            COMPOSE_FILE=/root/helpdesk/docker/docker-compose.helpdesk.yml
            ENV_FILE=/root/helpdesk/config/.env.dev

            test -f "$COMPOSE_FILE" || { echo "compose file not found: $COMPOSE_FILE"; exit 1; }
            test -f "$ENV_FILE" || { echo "env file not found: $ENV_FILE"; exit 1; }

            # Compose interpolates from the shell environment before .env, so
            # these pin the stack to the image this run just pushed. The compose
            # file's pull policy defaults to local-only for developer machines,
            # which would otherwise make `pull` a silent no-op here.
            export HELPDESK_IMAGE="$IMAGE_NAME"
            export HELPDESK_TAG="$GITHUB_SHA"
            export HELPDESK_PULL_POLICY=always

            COMPOSE="docker compose -f $COMPOSE_FILE --env-file $ENV_FILE"

            echo "==> Deploying ${HELPDESK_IMAGE}:${HELPDESK_TAG}"
            $COMPOSE pull
            $COMPOSE down
            $COMPOSE up -d

            # The site lives in a named volume and survives the restart, so
            # create-site short-circuits -- but a new image can carry schema
            # changes, which is what migrate is for.
            $COMPOSE exec -T backend bench --site all migrate

            # configurator and create-site are expected to be Exited; only the
            # long-running services have to answer.
            PORT="$(grep -E '^HELPDESK_PORT=' "$ENV_FILE" | cut -d= -f2 | tr -d '[:space:]')"
            PORT="${PORT:-8093}"
            for i in $(seq 1 30); do
              if curl -fsS "http://localhost:${PORT}/api/method/ping" >/dev/null 2>&1; then
                echo "Helpdesk is up on port ${PORT}."
                exit 0
              fi
              sleep 5
            done

            echo "Frontend did not answer on port ${PORT} within 150s."
            $COMPOSE ps
            $COMPOSE logs --tail 100 backend frontend
            exit 1

      - name: Send email
        if: always()
        uses: dawidd6/action-send-mail@v2
        with:
          # mail server settings
          server_address: smtp.gmail.com
          server_port: 465
          # user credentials
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          # email subject
          subject: Helpdesk Backend - Dev
          # email body as text
          body: ${{ github.job }} job in worflow ${{ github.workflow }} of ${{ github.repository }} has ${{ job.status }}
          # comma-separated string, send email to
          to: enganaskhalid@gmail.com
          # from email name
          from: Helpdesk Backend - Dev